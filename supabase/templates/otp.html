<div style="background:#f7f4ef;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:460px;margin:0 auto;background:#ffffff;border:1px solid #e7e0d6;border-radius:12px;overflow:hidden;">
    <div style="background:#6b1530;padding:20px 24px;color:#ffffff;font-size:18px;font-weight:bold;">EDU ClassRepo</div>
    <div style="padding:28px 24px;color:#2a2420;">
      <p style="margin:0 0 8px;font-size:16px;font-weight:bold;">Your verification code</p>
      <p style="margin:0 0 20px;font-size:14px;color:#5f564f;">Enter this code in EDU ClassRepo. It expires in 10 minutes.</p>
      <div style="background:#f7f4ef;border-radius:8px;padding:16px;text-align:center;font-size:30px;font-weight:bold;letter-spacing:8px;color:#6b1530;">{{ .Token }}</div>
      <p style="margin:20px 0 0;font-size:12px;color:#8a7f76;">If you didn't request this, you can ignore this email. Nobody can sign in without the code.</p>
    </div>
  </div>
</div>
